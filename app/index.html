<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Cello Tracker</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #00ff9f;
      --start-bg: #1a3a28;
      --start-color: #00ff9f;
      --stop-bg: #3a1a1a;
      --stop-color: #ff5555;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem;
      gap: 1.5rem;
    }

    .topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .nav-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .nav-link:hover { color: var(--accent); }

    /* The headline: accumulated playing time */
    .timer {
      font-size: 4rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.1;
      margin-top: 0.5rem;
    }

    .timer-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #detection-badge {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid #333;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #detection-badge.on {
      background: #1a3a28;
      color: var(--accent);
      border-color: var(--accent);
    }

    #session-line {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-height: 1.2em;
    }

    #btn-toggle {
      min-width: 220px;
      min-height: 60px;
      padding: 0 2rem;
      border: 1.5px solid var(--start-color);
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--start-bg);
      color: var(--start-color);
      transition: opacity 0.15s;
    }
    #btn-toggle.active {
      background: var(--stop-bg);
      color: var(--stop-color);
      border-color: var(--stop-color);
    }
    #btn-toggle:disabled { opacity: 0.4; cursor: not-allowed; }

    #status {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.3em;
    }

    #lifetime {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    #wake-lock-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    #https-warning {
      display: none;
      background: #3a1a1a;
      color: #ff5555;
      border: 1px solid #ff5555;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
    }

    #mic-denied-hint {
      display: none;
      background: var(--surface);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Cello Tracker</h1>
    <a class="nav-link" href="/settings">⚙ Settings</a>
  </div>

  <div id="https-warning">⚠️ HTTPS required — mic and wake lock will not work over HTTP.</div>

  <div class="timer-label">Playing time</div>
  <div id="playing" class="timer">00:00</div>

  <div id="detection-badge">● Not detecting</div>

  <button id="btn-toggle">▶ Start Session</button>

  <p id="session-line"></p>

  <p id="status"></p>

  <p id="lifetime"></p>

  <p id="wake-lock-status">Wake lock: —</p>

  <p id="mic-denied-hint">
    Microphone access was denied.<br>
    On iOS: <strong>Settings → Safari → Microphone → Allow</strong>
  </p>

  <script src="detector.js"></script>
  <script src="settings.js"></script>
  <script>
    // ── Elements ──────────────────────────────────────────────────────────────
    const btn            = document.getElementById('btn-toggle');
    const badge          = document.getElementById('detection-badge');
    const playingEl      = document.getElementById('playing');
    const sessionLineEl  = document.getElementById('session-line');
    const statusEl       = document.getElementById('status');
    const lifetimeEl     = document.getElementById('lifetime');
    const wlEl           = document.getElementById('wake-lock-status');
    const deniedEl       = document.getElementById('mic-denied-hint');
    const httpsWarn      = document.getElementById('https-warning');

    // ── HTTPS guard ───────────────────────────────────────────────────────────
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      httpsWarn.style.display = 'block';
    }

    // ── Session storage (this app's own data) ─────────────────────────────────
    const SESSIONS_KEY = 'cello.sessions';

    function loadSessions() {
      try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]'); }
      catch { return []; }
    }

    function saveSession(startMs, endMs, playMs) {
      // Skip throwaway sessions (started and stopped with nothing played).
      if (playMs < 1000) return;
      const arr = loadSessions();
      arr.push({
        start:     new Date(startMs).toISOString(),
        end:       new Date(endMs).toISOString(),
        playingMs: Math.round(playMs),
        sessionMs: endMs - startMs,
      });
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(arr));
    }

    // ── Detector ──────────────────────────────────────────────────────────────
    // Main app only consumes resolution + lifecycle; it never renders frames.
    const det = new CelloDetector(SettingsStore.load());

    det.onDetectionChange(onDetectionChange);
    det.onStatus(handleStatus);

    // ── State ─────────────────────────────────────────────────────────────────
    let active       = false;
    let sessionStart = null;   // wall-clock (Date.now) of session start
    let playingMs    = 0;      // banked detected time this session
    let playStart    = null;   // performance.now() while currently detecting
    let tickTimer    = null;

    function currentPlayingMs() {
      return playingMs + (playStart !== null ? performance.now() - playStart : 0);
    }

    // ── Detection → playing-time accumulation ─────────────────────────────────
    function onDetectionChange(on) {
      if (on) {
        playStart = performance.now();
      } else if (playStart !== null) {
        playingMs += performance.now() - playStart;
        playStart = null;
      }
      setBadge(on);
    }

    // ── Display ───────────────────────────────────────────────────────────────
    function formatClock(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      const mm = String(m % 60).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function formatHM(ms) {
      const m = Math.round(ms / 60000);
      const h = Math.floor(m / 60);
      return h > 0 ? `${h}h ${m % 60}m` : `${m}m`;
    }

    function updateDisplay() {
      playingEl.textContent = formatClock(currentPlayingMs());
      sessionLineEl.textContent = sessionStart
        ? `Session ${formatClock(Date.now() - sessionStart)}`
        : '';
    }

    function renderLifetime() {
      const arr = loadSessions();
      if (!arr.length) { lifetimeEl.textContent = 'No sessions logged yet'; return; }
      const total = arr.reduce((s, x) => s + (x.playingMs || 0), 0);
      lifetimeEl.textContent =
        `Lifetime: ${formatHM(total)} played · ${arr.length} session${arr.length > 1 ? 's' : ''}`;
    }

    function setBadge(on) {
      badge.classList.toggle('on', on);
      badge.textContent = on ? '● Cello detected' : '● Not detecting';
    }

    function setButtonActive(a) {
      btn.classList.toggle('active', a);
      btn.textContent = a ? '■ Stop Session' : '▶ Start Session';
    }

    function setWakeLockStatus(state) {
      const labels = {
        active:      'Wake lock: active 🟢',
        released:    'Wake lock: released (tab hidden) 🟡',
        unavailable: 'Wake lock: unavailable 🔴',
        idle:        'Wake lock: —',
      };
      wlEl.textContent = labels[state] ?? 'Wake lock: —';
    }

    function setStatus(text) { statusEl.textContent = text; }

    // ── Detector status events ────────────────────────────────────────────────
    function handleStatus(evt) {
      switch (evt.kind) {
        case 'requesting-mic':   setStatus('Requesting microphone…'); break;
        case 'reconnecting':     setStatus('Reconnecting…'); break;
        case 'reconnecting-mic': setStatus('Reconnecting — requesting microphone…'); break;
        case 'listening':        setStatus(''); break;
        case 'wakelock':         setWakeLockStatus(evt.state); break;
        case 'error':            handleDetectorError(evt.error); break;
      }
    }

    // Detector already tore down audio; bank what was played and reset to idle.
    function handleDetectorError(err) {
      if (playStart !== null) { playingMs += performance.now() - playStart; playStart = null; }
      if (sessionStart) saveSession(sessionStart, Date.now(), playingMs);
      stopTicking();
      active = false;
      sessionStart = null;
      setBadge(false);
      setButtonActive(false);
      btn.disabled = false;
      renderLifetime();
      updateDisplay();

      if (err?.name === 'NotAllowedError') {
        setStatus('Microphone access lost — session ended. Tap Start to try again.');
        deniedEl.style.display = 'block';
      } else {
        setStatus(`Session interrupted — ${err?.message ?? 'unknown error'}. Tap Start to try again.`);
      }
    }

    // ── Session start / stop ──────────────────────────────────────────────────
    function startTicking() { tickTimer = setInterval(updateDisplay, 250); }
    function stopTicking()  { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

    async function startSession() {
      btn.disabled = true;
      deniedEl.style.display = 'none';
      setStatus('');

      // Pick up any param changes made in /settings since page load.
      det.setParams(SettingsStore.load());

      try {
        await det.start();
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          setStatus('Microphone access denied. Check browser settings.');
          deniedEl.style.display = 'block';
        } else if (err.name === 'NotFoundError') {
          setStatus('No microphone found on this device.');
        } else {
          setStatus(`Error — ${err.message}`);
        }
        btn.disabled = false;
        return;
      }

      active       = true;
      sessionStart = Date.now();
      playingMs    = 0;
      playStart    = null;
      setBadge(false);
      setButtonActive(true);
      btn.disabled = false;
      startTicking();
      updateDisplay();
    }

    function stopSession() {
      det.stop();
      if (playStart !== null) { playingMs += performance.now() - playStart; playStart = null; }
      stopTicking();
      if (sessionStart) saveSession(sessionStart, Date.now(), playingMs);

      active = false;
      sessionStart = null;
      setBadge(false);
      setButtonActive(false);
      setStatus('');
      updateDisplay();     // freezes on the final playing time until next start
      renderLifetime();
    }

    btn.addEventListener('click', () => {
      if (active) stopSession();
      else startSession();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    renderLifetime();
    updateDisplay();
  </script>

</body>
</html>
