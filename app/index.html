<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Cello Tracker</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #00ff9f;
      --start-bg: #1a3a28;
      --start-color: #00ff9f;
      --stop-bg: #3a1a1a;
      --stop-color: #ff5555;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #btn-toggle {
      min-width: 200px;
      min-height: 56px;
      padding: 0 2rem;
      border: 1.5px solid var(--start-color);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--start-bg);
      color: var(--start-color);
      transition: opacity 0.15s;
    }

    #btn-toggle.active {
      background: var(--stop-bg);
      color: var(--stop-color);
      border-color: var(--stop-color);
    }

    #btn-toggle:disabled { opacity: 0.4; cursor: not-allowed; }

    #status {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.4em;
    }

    .canvas-wrap {
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid #2a2d3a;
    }

    #spectrum {
      display: block;
      width: 100%;
      height: 240px;
    }

    #f0-strip {
      display: block;
      width: 100%;
      height: 60px;
    }

    #stability-progress-wrap {
      width: 100%;
      max-width: 600px;
      height: 4px;
      background: #1a3a28;
      border-radius: 2px;
      overflow: hidden;
    }

    #stability-progress {
      height: 100%;
      width: 0%;
      background: #1a3a28;
      border-radius: 2px;
    }

    #detection-badge {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid #333;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    #detection-badge.on {
      background: #1a3a28;
      color: var(--accent);
      border-color: var(--accent);
    }

    #gate-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 1.2em;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .controls {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .slider-row label {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 6em;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .slider-row .value {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 2.5em;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .slider-row .unit {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 2.5em;
    }

    .stability-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .stability-toggle input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .stability-sliders {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding-left: 1.5rem;
    }

    #wake-lock-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    #https-warning {
      display: none;
      background: #3a1a1a;
      color: #ff5555;
      border: 1px solid #ff5555;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
    }

    #mic-denied-hint {
      display: none;
      background: var(--surface);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>Cello Tracker</h1>

  <div id="https-warning">⚠️ HTTPS required — mic and wake lock will not work over HTTP.</div>

  <button id="btn-toggle">▶ Start Session</button>

  <p id="status">Status: Idle</p>

  <div id="detection-badge">● Not detecting</div>

  <div id="gate-status"></div>

  <div class="canvas-wrap">
    <canvas id="spectrum"></canvas>
  </div>

  <div class="canvas-wrap">
    <canvas id="f0-strip"></canvas>
  </div>

  <div id="stability-progress-wrap">
    <div id="stability-progress"></div>
  </div>

  <div class="controls">
    <div class="slider-row">
      <label for="threshold-slider">Threshold</label>
      <input id="threshold-slider" type="range" min="1" max="200" value="15" />
      <span id="threshold-value" class="value">15</span>
      <span class="unit"></span>
    </div>

    <label class="stability-toggle">
      <input type="checkbox" id="stability-enabled" checked />
      Stability gate
    </label>
    <div class="stability-sliders">
      <div class="slider-row">
        <label for="tolerance-slider">Tolerance</label>
        <input id="tolerance-slider" type="range" min="20" max="100" step="5" value="30" />
        <span id="tolerance-value" class="value">30</span>
        <span class="unit">cents</span>
      </div>
      <div class="slider-row">
        <label for="duration-slider">Duration</label>
        <input id="duration-slider" type="range" min="100" max="500" step="25" value="200" />
        <span id="duration-value" class="value">200</span>
        <span class="unit">ms</span>
      </div>
    </div>
  </div>

  <p id="wake-lock-status">Wake lock: —</p>

  <p id="mic-denied-hint">
    Microphone access was denied.<br>
    On iOS: <strong>Settings → Safari → Microphone → Allow</strong>
  </p>

  <script>
    // ── Constants ─────────────────────────────────────────────────────────────
    const NUM_BARS           = 80;
    const MIN_FREQ           = 30;
    const MAX_FREQ           = 4000;
    const CELLO_LOW          = 65;
    const CELLO_HIGH         = 1200;
    const FFT_SIZE           = 4096;
    const HPS_HARMONICS      = 4;
    const ATTACK_MS          = 300;
    const RELEASE_MS         = 1500;
    const STABILITY_WINDOW_MS = 500;

    // ── Elements ──────────────────────────────────────────────────────────────
    const btn             = document.getElementById('btn-toggle');
    const statusEl        = document.getElementById('status');
    const canvas          = document.getElementById('spectrum');
    const ctx             = canvas.getContext('2d');
    const f0Canvas        = document.getElementById('f0-strip');
    const f0Ctx           = f0Canvas.getContext('2d');
    const progressBarEl   = document.getElementById('stability-progress');
    const gateStatusEl    = document.getElementById('gate-status');
    const wlEl            = document.getElementById('wake-lock-status');
    const deniedEl        = document.getElementById('mic-denied-hint');
    const httpsWarn       = document.getElementById('https-warning');
    const sliderEl        = document.getElementById('threshold-slider');
    const sliderValueEl   = document.getElementById('threshold-value');
    const detectionBadge  = document.getElementById('detection-badge');
    const stabilityChk    = document.getElementById('stability-enabled');
    const toleranceSlider = document.getElementById('tolerance-slider');
    const toleranceValue  = document.getElementById('tolerance-value');
    const durationSlider  = document.getElementById('duration-slider');
    const durationValue   = document.getElementById('duration-value');

    // ── HTTPS guard ───────────────────────────────────────────────────────────
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      httpsWarn.style.display = 'block';
    }

    // ── State ─────────────────────────────────────────────────────────────────
    let isSessionActive = false;
    let isRecovering    = false;
    let sessionStart    = null;
    let rafId           = null;
    let wakeLock        = null;
    let audioCtx        = null;
    let analyser        = null;
    let stream          = null;
    let sourceNode      = null;
    let freqData        = null;
    let hpsArray        = null;

    let isDetected    = false;
    let aboveMs       = 0;
    let belowMs       = 0;
    let lastFrameTime = null;

    // Stability gate state
    let f0History           = [];
    let stabilityGate       = false;
    let stabilityProgressMs = 0;

    // ── Persisted settings ────────────────────────────────────────────────────
    let threshold = parseInt(sliderEl.value, 10);

    let stabilityEnabled = localStorage.getItem('stability.enabled') !== 'false';
    stabilityChk.checked = stabilityEnabled;

    let stabilityToleranceCents = parseInt(localStorage.getItem('stability.toleranceCents') || '30', 10);
    toleranceSlider.value = stabilityToleranceCents;
    toleranceValue.textContent = stabilityToleranceCents;

    let stabilityDurationMs = parseInt(localStorage.getItem('stability.durationMs') || '200', 10);
    durationSlider.value = stabilityDurationMs;
    durationValue.textContent = stabilityDurationMs;

    sliderEl.addEventListener('input', () => {
      threshold = parseInt(sliderEl.value, 10);
      sliderValueEl.textContent = threshold;
    });

    stabilityChk.addEventListener('change', () => {
      stabilityEnabled = stabilityChk.checked;
      localStorage.setItem('stability.enabled', stabilityEnabled);
    });

    toleranceSlider.addEventListener('input', () => {
      stabilityToleranceCents = parseInt(toleranceSlider.value, 10);
      toleranceValue.textContent = stabilityToleranceCents;
      localStorage.setItem('stability.toleranceCents', stabilityToleranceCents);
    });

    durationSlider.addEventListener('input', () => {
      stabilityDurationMs = parseInt(durationSlider.value, 10);
      durationValue.textContent = stabilityDurationMs;
      localStorage.setItem('stability.durationMs', stabilityDurationMs);
    });

    // ── Bar frequency map (logarithmic, 30 Hz – 4 kHz) ───────────────────────
    const barDefs = Array.from({ length: NUM_BARS }, (_, i) => {
      const f1 = MIN_FREQ * Math.pow(MAX_FREQ / MIN_FREQ, i / NUM_BARS);
      const f2 = MIN_FREQ * Math.pow(MAX_FREQ / MIN_FREQ, (i + 1) / NUM_BARS);
      return { f1, f2, isCello: f1 < CELLO_HIGH && f2 > CELLO_LOW };
    });

    // ── HPS ───────────────────────────────────────────────────────────────────

    // Geometric mean of HPS harmonics, scaled to 0–255.
    function computeHPS() {
      const len = hpsArray.length;
      for (let i = 0; i < len; i++) {
        let product = freqData[i];
        for (let k = 2; k <= HPS_HARMONICS; k++) {
          product *= freqData[k * i];
        }
        hpsArray[i] = Math.pow(product, 1 / HPS_HARMONICS);
      }
    }

    function getHPSBarValue(bar) {
      const binWidth = audioCtx.sampleRate / analyser.fftSize;
      const b1 = Math.max(0, Math.round(bar.f1 / binWidth));
      const b2 = Math.round(bar.f2 / binWidth);
      let sum = 0, count = 0;
      for (let b = b1; b <= Math.min(b2, hpsArray.length - 1); b++) {
        sum += hpsArray[b];
        count++;
      }
      return count > 0 ? sum / count : 0;
    }

    // Returns the strongest HPS peak within the cello frequency range.
    function findCelloPeak() {
      const binWidth = audioCtx.sampleRate / analyser.fftSize;
      const lowBin   = Math.max(1, Math.round(CELLO_LOW / binWidth));
      const highBin  = Math.min(Math.round(CELLO_HIGH / binWidth), hpsArray.length - 1);
      let peakBin = lowBin, peakVal = 0;
      for (let i = lowBin; i <= highBin; i++) {
        if (hpsArray[i] > peakVal) { peakVal = hpsArray[i]; peakBin = i; }
      }
      const freq   = Math.round(peakBin * binWidth);
      const barIdx = barDefs.findIndex(b => freq >= b.f1 && freq < b.f2);
      return { freq, val: peakVal, barIdx };
    }

    // ── Stability gate ────────────────────────────────────────────────────────
    function medianOf(arr) {
      const sorted = arr.slice().sort((a, b) => a - b);
      return sorted[Math.floor(sorted.length / 2)];
    }

    function computeStability(peak, dt) {
      const now = performance.now();

      if (peak.val > 0) {
        f0History.push({ timeMs: now, freq: peak.freq });
      }
      const cutoff = now - STABILITY_WINDOW_MS;
      while (f0History.length > 0 && f0History[0].timeMs < cutoff) {
        f0History.shift();
      }

      if (f0History.length < 3) {
        stabilityGate = false;
        stabilityProgressMs = 0;
        return;
      }

      const center = medianOf(f0History.map(s => s.freq));
      const cents  = Math.abs(1200 * Math.log2(peak.freq / center));

      if (cents <= stabilityToleranceCents) {
        stabilityProgressMs += dt;
        if (stabilityProgressMs >= stabilityDurationMs) {
          stabilityGate = true;
        }
      } else {
        stabilityProgressMs = 0;
        stabilityGate = false;
      }
    }

    // ── f0 history strip ──────────────────────────────────────────────────────
    function logFreqToY(freq, H) {
      const logMin = Math.log2(CELLO_LOW);
      const logMax = Math.log2(CELLO_HIGH);
      const clamped = Math.max(CELLO_LOW, Math.min(CELLO_HIGH, freq));
      return H - ((Math.log2(clamped) - logMin) / (logMax - logMin)) * H;
    }

    function drawF0Strip() {
      const W = f0Canvas.offsetWidth;
      const H = f0Canvas.offsetHeight;

      f0Ctx.fillStyle = '#0f1117';
      f0Ctx.fillRect(0, 0, W, H);

      if (f0History.length < 2) return;

      const now    = performance.now();
      const center = medianOf(f0History.map(s => s.freq));

      // Tolerance band centered on running median
      const bandHigh = center * Math.pow(2,  stabilityToleranceCents / 1200);
      const bandLow  = center * Math.pow(2, -stabilityToleranceCents / 1200);
      const bandTopY = logFreqToY(bandHigh, H);
      const bandBotY = logFreqToY(bandLow,  H);
      f0Ctx.fillStyle = 'rgba(0, 255, 159, 0.08)';
      f0Ctx.fillRect(0, bandTopY, W, bandBotY - bandTopY);

      // Determine line color based on whether current f0 is inside the band
      const lastFreq  = f0History[f0History.length - 1].freq;
      const lastCents = Math.abs(1200 * Math.log2(lastFreq / center));
      const inBand    = lastCents <= stabilityToleranceCents;

      f0Ctx.strokeStyle = inBand ? '#00ff9f' : '#666';
      f0Ctx.lineWidth   = 1.5;
      f0Ctx.beginPath();

      const windowStart = now - STABILITY_WINDOW_MS;
      let started = false;
      for (const sample of f0History) {
        const x = ((sample.timeMs - windowStart) / STABILITY_WINDOW_MS) * W;
        const y = logFreqToY(sample.freq, H);
        if (!started) { f0Ctx.moveTo(x, y); started = true; }
        else           { f0Ctx.lineTo(x, y); }
      }
      f0Ctx.stroke();
    }

    function drawF0Idle() {
      const W = f0Canvas.offsetWidth;
      const H = f0Canvas.offsetHeight;
      f0Ctx.fillStyle = '#0f1117';
      f0Ctx.fillRect(0, 0, W, H);
    }

    // ── Stability progress bar ────────────────────────────────────────────────
    function updateProgressBar() {
      const pct = stabilityDurationMs > 0
        ? Math.min(stabilityProgressMs / stabilityDurationMs, 1) * 100
        : 0;
      progressBarEl.style.width = pct + '%';
      progressBarEl.style.background = stabilityGate ? '#00ff9f'
                                      : pct > 0      ? '#00cc7a'
                                                     : '#1a3a28';
    }

    function resetProgressBar() {
      progressBarEl.style.width = '0%';
      progressBarEl.style.background = '#1a3a28';
    }

    // ── Gate status strip ─────────────────────────────────────────────────────
    function dot(pass) {
      return pass
        ? '<span style="color:#00ff9f">●</span>'
        : '<span style="color:#444">○</span>';
    }

    function updateGateStatus(hpsPass) {
      let html = `HPS: ${dot(hpsPass)}`;
      if (stabilityEnabled) {
        html += `<span style="margin-left:1rem">Stability: ${dot(stabilityGate)}</span>`;
      }
      gateStatusEl.innerHTML = html;
    }

    function clearGateStatus() {
      gateStatusEl.innerHTML = '';
    }

    // ── Note name ─────────────────────────────────────────────────────────────
    function freqToNote(freq) {
      const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
      const midi  = Math.round(69 + 12 * Math.log2(freq / 440));
      return names[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function setStatus(text) { statusEl.textContent = 'Status: ' + text; }

    function formatElapsed(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function setWakeLockStatus(state) {
      const labels = {
        active:      'Wake lock: active 🟢',
        released:    'Wake lock: released (tab hidden) 🟡',
        unavailable: 'Wake lock: unavailable 🔴',
        idle:        'Wake lock: —',
      };
      wlEl.textContent = labels[state] ?? 'Wake lock: —';
    }

    function setButtonActive(active) {
      btn.classList.toggle('active', active);
      btn.textContent = active ? '■ Stop Session' : '▶ Start Session';
    }

    function setDetection(on) {
      if (on === isDetected) return;
      isDetected = on;
      detectionBadge.classList.toggle('on', on);
      detectionBadge.textContent = on ? '● Cello detected' : '● Not detecting';
    }

    // ── Wake Lock ─────────────────────────────────────────────────────────────
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) { setWakeLockStatus('unavailable'); return; }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        setWakeLockStatus('active');
        wakeLock.addEventListener('release', () => {
          if (isSessionActive) setWakeLockStatus('released');
        });
      } catch { setWakeLockStatus('unavailable'); }
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      setWakeLockStatus('idle');
    }

    // ── Canvas sizing ─────────────────────────────────────────────────────────
    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = canvas.offsetWidth  * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.scale(dpr, dpr);
    }

    function sizeF0Canvas() {
      const dpr = window.devicePixelRatio || 1;
      f0Canvas.width  = f0Canvas.offsetWidth  * dpr;
      f0Canvas.height = f0Canvas.offsetHeight * dpr;
      f0Ctx.scale(dpr, dpr);
    }

    // ── Spectrum canvas draw ──────────────────────────────────────────────────
    function drawIdle() {
      const W = canvas.offsetWidth;
      const H = canvas.offsetHeight;
      ctx.fillStyle = '#0f1117';
      ctx.fillRect(0, 0, W, H);
      const barW = W / NUM_BARS;
      const gap  = Math.max(1, barW * 0.2);
      for (let i = 0; i < NUM_BARS; i++) {
        ctx.fillStyle = barDefs[i].isCello ? '#1a3a28' : '#161920';
        ctx.fillRect(i * barW + gap / 2, H - 2, barW - gap, 2);
      }
    }

    function draw() {
      rafId = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(freqData);
      computeHPS();

      const W = canvas.offsetWidth;
      const H = canvas.offsetHeight;
      const barW = W / NUM_BARS;
      const gap  = Math.max(1, barW * 0.2);

      ctx.fillStyle = '#0f1117';
      ctx.fillRect(0, 0, W, H);

      const peak     = findCelloPeak();
      const showPeak = peak.val > threshold * 0.3;

      for (let i = 0; i < NUM_BARS; i++) {
        const val  = getHPSBarValue(barDefs[i]);
        const barH = (val / 255) * H;

        if (i === peak.barIdx && showPeak) {
          ctx.fillStyle = '#ffffff';
        } else if (barDefs[i].isCello) {
          ctx.fillStyle = '#00cc7a';
        } else {
          ctx.fillStyle = '#2a3a32';
        }

        ctx.fillRect(i * barW + gap / 2, H - barH, barW - gap, barH);
      }

      const now = performance.now();
      const dt  = lastFrameTime ? Math.min(now - lastFrameTime, 100) : 16;
      lastFrameTime = now;

      // Stage 1: pitch stability gate
      computeStability(peak, dt);

      const hpsPass      = peak.val > threshold;
      const stabilityPass = !stabilityEnabled || stabilityGate;

      if (hpsPass && stabilityPass) {
        belowMs = 0;
        aboveMs += dt;
        if (!isDetected && aboveMs >= ATTACK_MS) setDetection(true);
      } else {
        aboveMs = 0;
        belowMs += dt;
        if (isDetected && belowMs >= RELEASE_MS) setDetection(false);
      }

      // Threshold line — dashed, turns green when detection is active
      const thresholdY = H - (threshold / 255) * H;
      ctx.strokeStyle = isDetected ? '#00ff9f' : '#555';
      ctx.lineWidth   = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(0, thresholdY);
      ctx.lineTo(W, thresholdY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Detected pitch label
      if (showPeak) {
        ctx.font      = 'bold 13px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = isDetected ? '#00ff9f' : '#aaa';
        ctx.fillText(`${freqToNote(peak.freq)}  ${peak.freq} Hz`, 8, 20);
      }

      // Stage 1 visualizations
      drawF0Strip();
      updateProgressBar();
      updateGateStatus(hpsPass);

      setStatus(`Listening — ${formatElapsed(Date.now() - sessionStart)}`);
    }

    function stopRafLoop() {
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    }

    // ── Mic restart (recovery) ────────────────────────────────────────────────
    async function restartMicStream() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      if (sourceNode) sourceNode.disconnect();
      sourceNode = audioCtx.createMediaStreamSource(stream);
      sourceNode.connect(analyser);
    }

    // ── Error recovery ────────────────────────────────────────────────────────
    function handleUnrecoverableError(err) {
      isSessionActive = false;
      stopRafLoop();
      releaseWakeLock();
      setDetection(false);
      clearGateStatus();
      resetProgressBar();
      drawIdle();
      drawF0Idle();
      setButtonActive(false);
      btn.disabled = false;

      if (err?.name === 'NotAllowedError') {
        setStatus('Microphone access lost — session ended. Tap Start to try again.');
        deniedEl.style.display = 'block';
      } else {
        setStatus(`Session interrupted — ${err?.message ?? 'unknown error'}. Tap Start to try again.`);
      }
    }

    async function recoverSession() {
      isRecovering = true;
      setStatus('Reconnecting…');
      try {
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        const track = stream?.getAudioTracks()[0];
        if (!track || track.readyState === 'ended') {
          setStatus('Reconnecting — requesting microphone…');
          await restartMicStream();
        }
        await requestWakeLock();
        setStatus(`Listening — ${formatElapsed(Date.now() - sessionStart)}`);
      } catch (err) {
        handleUnrecoverableError(err);
      } finally {
        isRecovering = false;
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (!isSessionActive || document.visibilityState !== 'visible') return;
      if (isRecovering) return;
      await recoverSession();
    });

    // ── Session start ─────────────────────────────────────────────────────────
    async function startSession() {
      btn.disabled = true;
      deniedEl.style.display = 'none';
      setStatus('Requesting microphone…');

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          setStatus('Error — Microphone access denied. Check browser settings.');
          deniedEl.style.display = 'block';
        } else if (err.name === 'NotFoundError') {
          setStatus('Error — No microphone found on this device.');
        } else {
          setStatus(`Error — ${err.message}`);
        }
        btn.disabled = false;
        return;
      }

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch {
        stream.getTracks().forEach(t => t.stop());
        setStatus('Error — Web Audio not supported in this browser.');
        btn.disabled = false;
        return;
      }

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = FFT_SIZE;
      analyser.smoothingTimeConstant = 0.75;

      sourceNode = audioCtx.createMediaStreamSource(stream);
      sourceNode.connect(analyser);
      // NOT connected to destination — analysis only, no feedback

      freqData = new Uint8Array(analyser.frequencyBinCount);
      hpsArray = new Float32Array(Math.floor(analyser.frequencyBinCount / HPS_HARMONICS));

      sizeCanvas();
      sizeF0Canvas();
      await requestWakeLock();

      isDetected          = false;
      aboveMs             = 0;
      belowMs             = 0;
      lastFrameTime       = null;
      f0History           = [];
      stabilityGate       = false;
      stabilityProgressMs = 0;
      setDetection(false);
      clearGateStatus();
      resetProgressBar();

      sessionStart    = Date.now();
      isSessionActive = true;
      setButtonActive(true);
      btn.disabled = false;

      draw();
    }

    // ── Session stop ──────────────────────────────────────────────────────────
    function stopSession() {
      isSessionActive = false;
      stopRafLoop();
      releaseWakeLock();

      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      sourceNode   = null;
      analyser     = null;
      freqData     = null;
      hpsArray     = null;
      sessionStart = null;

      f0History           = [];
      stabilityGate       = false;
      stabilityProgressMs = 0;

      setDetection(false);
      clearGateStatus();
      resetProgressBar();
      drawIdle();
      drawF0Idle();
      setButtonActive(false);
      setStatus('Idle');
    }

    // ── Button handler ────────────────────────────────────────────────────────
    btn.addEventListener('click', () => {
      if (isSessionActive) stopSession();
      else startSession();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    sizeCanvas();
    sizeF0Canvas();
    drawIdle();
    drawF0Idle();
  </script>

</body>
</html>
